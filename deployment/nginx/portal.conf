# No hostname hardcoded — set server_name via extra snippet or keep catch-all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    limit_req zone=bte_general burst=20 nodelay;

    location = /live {
        proxy_pass http://bte_api/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://bte_api/health;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://bte_api/health;
        proxy_set_header Host $host;
    }

    location = /version {
        proxy_pass http://bte_api/version;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://bte_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /analysis {
        proxy_pass http://bte_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://bte_portal;
        proxy_cache bte_static;
        proxy_cache_valid 200 60m;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'" always;
    }

    location / {
        proxy_pass http://bte_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

