  marriage.q6.good_foundation:

    semantic_state: good_foundation
    tone: professional_warm
    version: "1.0.0"
    status: approved

    headline: "Hai lá số có nhiều điểm thuận để hai bạn tham khảo khi cân nhắc cuộc sống chung."
    meaning: "Trong phép đối chiếu này, phần hòa hợp và bổ trợ nổi bật hơn phần gây sức ép. Đây là gợi ý để hai bạn nhận ra điểm mạnh của nhau, không phải bảo đảm cho một cuộc hôn nhân bền vững."
    plain_customer_text: "Nếu hai bạn đang cân nhắc cuộc sống chung, hãy trao đổi về mong muốn, tài chính, trách nhiệm và cách giải quyết bất đồng. Quyết định kết hôn thuộc về hai bạn, dựa trên tình cảm, sự tự nguyện và điều kiện thực tế."
    technical_explanation: >
      Trạng thái này chỉ được sử dụng khi Assessment tổng hợp Q1–Q4
      cho thấy độ hòa hợp, khả năng bổ trợ và độ ổn định đều ở mức thuận lợi,
      đồng thời không có Finding áp lực lớn đủ để làm thay đổi kết luận tổng thể.

    supporting_fact_templates:

      - id: compatibility_good
        source_fact: compatibility_good
        template: "Độ hòa hợp tổng thể giữa hai bạn đang ở mức tích cực."
        slots: []
        status: approved

      - id: mutual_support
        source_fact: mutual_support
        template: "Hai bạn có khả năng bổ trợ cho nhau theo cả hai chiều."
        slots: []
        status: approved

      - id: personality_balance
        source_fact: personality_balance
        template: >
          Tính cách có những điểm tương đồng hoặc bù trừ đủ để tạo sự cân bằng.
        slots: []
        status: approved

      - id: stability_good
        source_fact: stability_good
        template: >
          Nền tảng hôn nhân có khả năng duy trì ổn định nếu tiếp tục được vun đắp.
        slots: []
        status: approved

      - id: finance_support
        source_fact: finance_support
        template: >
          Khả năng phối hợp về tài chính và phát triển chung có tín hiệu thuận lợi.
        slots: []
        status: approved

    limitation_templates:

      - id: no_guarantee
        source_fact: no_guarantee
        template: >
          Nền tảng tốt không có nghĩa cuộc hôn nhân sẽ tự nhiên thuận lợi mà không cần sự vun đắp.
        slots: []
        status: approved

      - id: practical_relationship
        source_fact: practical_relationship
        template: "Kết quả thực tế vẫn phụ thuộc vào cách hai bạn giao tiếp, chia sẻ trách nhiệm và cùng giải quyết khó khăn."
        slots: []
        status: approved

    closing: "Những nhận định này chỉ là góc tham khảo từ Bát Tự, không phải căn cứ quyết định kết hôn hoặc chia tay."
    forbidden_terms:
