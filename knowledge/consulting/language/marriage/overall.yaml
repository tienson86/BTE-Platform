    technical_explanation: >
      Trạng thái này chỉ được sử dụng khi Assessment tổng hợp
      cho thấy các Finding tạo áp lực đang chiếm ưu thế rõ
      và phần cứu giải hiện chưa đủ mạnh để đưa kết luận sang nhóm thuận lợi hơn.

