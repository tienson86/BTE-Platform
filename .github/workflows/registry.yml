name: Registry Validation

on:
  push:
    paths:
      - "knowledge/registry/**"
      - "services/registry_*.py"
      - "services/__init__.py"
      - "registry_cli.py"
      - "tests/registry/**"
      - "docs/registry/**"
      - ".github/workflows/registry.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - "knowledge/registry/**"
      - "services/registry_*.py"
      - "services/__init__.py"
      - "registry_cli.py"
      - "tests/registry/**"
      - "docs/registry/**"
      - ".github/workflows/registry.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Registry validate + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-cov

      - name: JSON + schema + consistency validation
        run: python registry_cli.py validate --include-samples

      - name: Registry statistics smoke
        run: python registry_cli.py stats

      - name: Unit tests with coverage
        run: >
          python -m pytest tests/registry -q
          --cov=services
          --cov=registry_cli
          --cov-report=term-missing
          --cov-fail-under=90
