<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  width="1024"
  height="1024"
  role="img"
  aria-label="Hậu Thiên Bát Quái — Later Heaven Bagua"
>
  <title>Bagua Hậu Thiên (Later Heaven)</title>
  <desc>
    Official BTE Later Heaven Bagua. Eight equal 45° sectors, clockwise from 12 o'clock:
    Khảm (Bắc), Cấn (Đông Bắc), Chấn (Đông), Tốn (Đông Nam),
    Ly (Nam), Khôn (Tây Nam), Đoài (Tây), Càn (Tây Bắc).
    Center circle is reserved for dynamic overlay (do not hardcode values).
  </desc>

  <defs>
    <clipPath id="octagon-clip">
      <polygon points="339.792,96.254 684.208,96.254 927.746,339.792 927.746,684.208 684.208,927.746 339.792,927.746 96.254,684.208 96.254,339.792"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <g clip-path="url(#octagon-clip)">
    <!-- White octagon field -->
    <polygon points="339.792,96.254 684.208,96.254 927.746,339.792 927.746,684.208 684.208,927.746 339.792,927.746 96.254,684.208 96.254,339.792" fill="#FFFFFF"/>

    <!-- Red outer name bands -->
    <g id="name-bands">
    <path id="band-bac" d="M 339.792 96.254 L 684.208 96.254 L 654.358 168.317 L 369.642 168.317 Z" fill="#9F1D20"/>
    <path id="band-dong-bac" d="M 684.208 96.254 L 927.746 339.792 L 855.683 369.642 L 654.358 168.317 Z" fill="#9F1D20"/>
    <path id="band-dong" d="M 927.746 339.792 L 927.746 684.208 L 855.683 654.358 L 855.683 369.642 Z" fill="#9F1D20"/>
    <path id="band-dong-nam" d="M 927.746 684.208 L 684.208 927.746 L 654.358 855.683 L 855.683 654.358 Z" fill="#9F1D20"/>
    <path id="band-nam" d="M 684.208 927.746 L 339.792 927.746 L 369.642 855.683 L 654.358 855.683 Z" fill="#9F1D20"/>
    <path id="band-tay-nam" d="M 339.792 927.746 L 96.254 684.208 L 168.317 654.358 L 369.642 855.683 Z" fill="#9F1D20"/>
    <path id="band-tay" d="M 96.254 684.208 L 96.254 339.792 L 168.317 369.642 L 168.317 654.358 Z" fill="#9F1D20"/>
    <path id="band-tay-bac" d="M 96.254 339.792 L 339.792 96.254 L 369.642 168.317 L 168.317 369.642 Z" fill="#9F1D20"/>
    </g>

    <g id="sector-dividers">
    <line x1="451.919" y1="366.951" x2="340.175" y2="97.178" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="572.081" y1="366.951" x2="683.825" y2="97.178" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="657.049" y1="451.919" x2="926.822" y2="340.175" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="657.049" y1="572.081" x2="926.822" y2="683.825" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="572.081" y1="657.049" x2="683.825" y2="926.822" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="451.919" y1="657.049" x2="340.175" y2="926.822" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="366.951" y1="572.081" x2="97.178" y2="683.825" stroke="#6B7280" stroke-width="2.0"/>
    <line x1="366.951" y1="451.919" x2="97.178" y2="340.175" stroke="#6B7280" stroke-width="2.0"/>
    </g>

    <g id="sector-bac" data-direction="BẮC" data-trigram="KHẢM">
      <g transform="translate(512 240.158) rotate(0)" fill="#111111">
      <rect x="-34.8" y="16.4" width="28.8" height="7.2"/>
      <rect x="6" y="16.4" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="28.8" height="7.2"/>
      <rect x="6" y="-23.6" width="28.8" height="7.2"/>
      </g>
      <text x="512" y="132.286" text-anchor="middle" dominant-baseline="central" transform="rotate(0 512 132.286)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">KHẢM</text>
      <text x="512" y="282" text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.05em">BẮC</text>
    </g>
    <g id="sector-dong-bac" data-direction="ĐÔNG BẮC" data-trigram="CẤN">
      <g transform="translate(704.221 319.779) rotate(45)" fill="#111111">
      <rect x="-34.8" y="16.4" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="28.8" height="7.2"/>
      <rect x="6" y="-3.6" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="28.8" height="7.2"/>
      <rect x="6" y="-23.6" width="28.8" height="7.2"/>
      </g>
      <text x="780.499" y="243.501" text-anchor="middle" dominant-baseline="central" transform="rotate(45 780.499 243.501)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">CẤN</text>
      <text text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="0.03em"><tspan x="674.635" y="340.365">ĐÔNG</tspan><tspan x="674.635" y="358.365">BẮC</tspan></text>
    </g>
    <g id="sector-dong" data-direction="ĐÔNG" data-trigram="CHẤN">
      <g transform="translate(783.842 512) rotate(90)" fill="#111111">
      <rect x="-34.8" y="16.4" width="28.8" height="7.2"/>
      <rect x="6" y="16.4" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="28.8" height="7.2"/>
      <rect x="6" y="-3.6" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="69.6" height="7.2"/>
      </g>
      <text x="891.714" y="512" text-anchor="middle" dominant-baseline="central" transform="rotate(90 891.714 512)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">CHẤN</text>
      <text x="742" y="512" text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.05em">ĐÔNG</text>
    </g>
    <g id="sector-dong-nam" data-direction="ĐÔNG NAM" data-trigram="TỐN">
      <g transform="translate(704.221 704.221) rotate(135)" fill="#111111">
      <rect x="-34.8" y="16.4" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="28.8" height="7.2"/>
      <rect x="6" y="-23.6" width="28.8" height="7.2"/>
      </g>
      <text x="780.499" y="780.499" text-anchor="middle" dominant-baseline="central" transform="rotate(315 780.499 780.499)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">TỐN</text>
      <text text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="0.03em"><tspan x="674.635" y="665.635">ĐÔNG</tspan><tspan x="674.635" y="683.635">NAM</tspan></text>
    </g>
    <g id="sector-nam" data-direction="NAM" data-trigram="LY">
      <g transform="translate(512 783.842) rotate(180)" fill="#111111">
      <rect x="-34.8" y="16.4" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="28.8" height="7.2"/>
      <rect x="6" y="-3.6" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="69.6" height="7.2"/>
      </g>
      <text x="512" y="891.714" text-anchor="middle" dominant-baseline="central" transform="rotate(360 512 891.714)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">LY</text>
      <text x="512" y="742" text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.05em">NAM</text>
    </g>
    <g id="sector-tay-nam" data-direction="TÂY NAM" data-trigram="KHÔN">
      <g transform="translate(319.779 704.221) rotate(225)" fill="#111111">
      <rect x="-34.8" y="16.4" width="28.8" height="7.2"/>
      <rect x="6" y="16.4" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="28.8" height="7.2"/>
      <rect x="6" y="-3.6" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="28.8" height="7.2"/>
      <rect x="6" y="-23.6" width="28.8" height="7.2"/>
      </g>
      <text x="243.501" y="780.499" text-anchor="middle" dominant-baseline="central" transform="rotate(405 243.501 780.499)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">KHÔN</text>
      <text text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="0.03em"><tspan x="349.365" y="665.635">TÂY</tspan><tspan x="349.365" y="683.635">NAM</tspan></text>
    </g>
    <g id="sector-tay" data-direction="TÂY" data-trigram="ĐOÀI">
      <g transform="translate(240.158 512) rotate(270)" fill="#111111">
      <rect x="-34.8" y="16.4" width="28.8" height="7.2"/>
      <rect x="6" y="16.4" width="28.8" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="69.6" height="7.2"/>
      </g>
      <text x="132.286" y="512" text-anchor="middle" dominant-baseline="central" transform="rotate(270 132.286 512)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">ĐOÀI</text>
      <text x="282" y="512" text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.05em">TÂY</text>
    </g>
    <g id="sector-tay-bac" data-direction="TÂY BẮC" data-trigram="CÀN">
      <g transform="translate(319.779 319.779) rotate(315)" fill="#111111">
      <rect x="-34.8" y="16.4" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-3.6" width="69.6" height="7.2"/>
      <rect x="-34.8" y="-23.6" width="69.6" height="7.2"/>
      </g>
      <text x="243.501" y="243.501" text-anchor="middle" dominant-baseline="central" transform="rotate(315 243.501 243.501)" fill="#FFFFFF" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26.4" font-weight="700" letter-spacing="0.1em">CÀN</text>
      <text text-anchor="middle" dominant-baseline="central" fill="#111111" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="0.03em"><tspan x="349.365" y="340.365">TÂY</tspan><tspan x="349.365" y="358.365">BẮC</tspan></text>
    </g>
  </g>

  <!-- Outer border (polish) -->
  <polygon
    id="bagua-outer-border"
    points="336.731,88.863 687.269,88.863 935.137,336.731 935.137,687.269 687.269,935.137 336.731,935.137 88.863,687.269 88.863,336.731"
    fill="none"
    stroke="#9F1D20"
    stroke-width="3"
    stroke-linejoin="miter"
  />

  <!-- Main octagon border -->
  <polygon
    id="bagua-octagon-border"
    points="339.792,96.254 684.208,96.254 927.746,339.792 927.746,684.208 684.208,927.746 339.792,927.746 96.254,684.208 96.254,339.792"
    fill="none"
    stroke="#9F1D20"
    stroke-width="8.0"
    stroke-linejoin="miter"
  />

  <!-- Dynamic center placeholder -->
  <g id="center-placeholder">
    <circle
      id="center-circle"
      cx="512"
      cy="512"
      r="157"
      fill="#FFFFFF"
      stroke="#9F1D20"
      stroke-width="3"
    />
    <text
      id="center-title-placeholder"
      x="512"
      y="492"
      text-anchor="middle"
      dominant-baseline="central"
      fill="#9F1D20"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="28"
      font-weight="700"
    ></text>
    <text
      id="center-score-placeholder"
      x="512"
      y="540"
      text-anchor="middle"
      dominant-baseline="central"
      fill="#9F1D20"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="48"
      font-weight="700"
    ></text>
  </g>
</svg>
