<div class="panel login-page">
  <header class="page-hero">
    <div>
      <h1 data-i18n="login.title"></h1>
      <p class="muted" data-i18n="login.hint"></p>
    </div>
  </header>
  <form id="loginForm" class="form-section" style="max-width:420px" novalidate>
    <div class="form-section-grid" style="grid-template-columns:1fr">
      <label class="full"><span data-i18n="login.username"></span>
        <input id="username" required autocomplete="username" />
      </label>
      <label class="full"><span data-i18n="login.password"></span>
        <input id="password" type="password" required autocomplete="current-password" />
      </label>
    </div>
    <div class="toolbar">
      <button type="submit" data-i18n="login.submit"></button>
      <button type="button" class="secondary" id="btnLogout" data-i18n="login.logout"></button>
      <a class="btn secondary" href="/good-date" data-i18n="login.guest"></a>
    </div>
  </form>
  <p class="muted" id="loginStatus"></p>
  <p>Chưa có tài khoản? <a href="/membership">Đăng ký thành viên BTE Platform</a>.</p>
</div>
<script src="/static/js/login.js?v=member-01"></script>
