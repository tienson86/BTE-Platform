<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{DOC_TITLE}}</title>
  <link rel="stylesheet" href="/static/css/portal.css" />
  <script>
    window.__BTE_I18N__ = {{I18N_JSON}};
    window.__BTE_I18N_LOCALE__ = "{{I18N_LOCALE}}";
  </script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/result_store.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui/components.js"></script>
  <script src="/static/js/ui/module_registry.js"></script>
  <script src="/static/js/ui/shell.js"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <div class="app-shell">
    <header class="app-header" id="appHeader">
      <a class="app-brand" href="/good-date">BTE <span>Portal</span></a>
      <button type="button" class="app-nav-toggle" id="btnNavToggle" aria-label="Mở điều hướng" aria-controls="appNav" aria-expanded="false">
        <span class="app-nav-toggle__bar" aria-hidden="true"></span>
        <span class="app-nav-toggle__bar" aria-hidden="true"></span>
        <span class="app-nav-toggle__bar" aria-hidden="true"></span>
      </button>
      <nav class="app-nav nav" id="appNav" data-customer-nav="primary" aria-label="Điều hướng chính">{{NAV}}</nav>
      <div class="app-header-actions">
        <button type="button" id="btnThemeToggle" class="secondary" aria-pressed="false">Dark</button>
        <a class="app-user" href="/profile" aria-label="Hồ sơ" title="Hồ sơ">
          <span class="app-user__avatar" aria-hidden="true">U</span>
        </a>
      </div>
    </header>
    <div class="app-main">
      <div id="globalFlash" class="flash" role="status"></div>
      <main id="mainContent">
        {{CONTENT}}
      </main>
    </div>
  </div>
  <script>if (window.BteI18n) BteI18n.apply(document);</script>
</body>
</html>
