<!-- COMMUNITY_PANEL_START -->
<section class="communications-page" data-admin-mode="false" data-communications="community">
  <header class="comm-hero"><div><h1 class="comm-title">Trao đổi kiến thức</h1><p>Thành viên cùng hỏi đáp. Chủ đề mới chỉ hiển thị chung sau khi Admin duyệt.</p></div><div class="comm-actions"><button type="button" id="newKnowledgeTopic">Đặt câu hỏi / Tạo chủ đề</button><button type="button" class="secondary" id="refreshKnowledge">Tải lại</button></div></header>
  <p id="knowledgeState" role="status" aria-live="polite"></p>
  <div id="knowledgeWorkspace" hidden>
    <label id="knowledgeCategoryFilterLabel" class="comm-category-filter">Chuyên mục<select id="knowledgeCategoryFilter"><option value="">Tất cả chuyên mục</option></select></label>
    <nav class="comm-tabs" aria-label="Nhóm chủ đề"><button type="button" data-topic-scope="feed" aria-pressed="true">Chủ đề đã duyệt</button><button type="button" data-topic-scope="mine" aria-pressed="false">Chủ đề của tôi</button><button type="button" data-topic-scope="pending" data-moderator-only hidden aria-pressed="false">Chờ Admin duyệt</button><button type="button" data-topic-scope="all" data-moderator-only hidden aria-pressed="false">Tất cả chủ đề</button></nav>
    <form id="knowledgeTopicForm" class="panel comm-form" hidden><h2 id="knowledgeFormTitle">Tạo chủ đề</h2><label id="knowledgeTopicCategoryLabel">Thuộc chuyên mục<select name="category_id"><option value="">Trao đổi chung</option></select></label><label>Tiêu đề<input name="title" maxlength="180" required /></label><label>Nội dung<textarea name="body" maxlength="20000" rows="7" required></textarea></label><p class="muted">Nội dung sẽ được gửi Admin duyệt. Khi sửa chủ đề đã hiển thị, chủ đề sẽ chờ duyệt lại.</p><div class="comm-actions"><button type="submit">Gửi duyệt</button><button type="button" class="secondary" id="cancelKnowledgeTopic">Hủy</button></div><p id="knowledgeFormState" role="alert"></p></form>
    <section id="knowledgeTopicList" class="panel"><h2 id="knowledgeListTitle">Chủ đề đã duyệt</h2><p id="knowledgeTopicCount" class="muted"></p><div id="knowledgeTopics"></div><div class="comm-actions comm-pagination"><button type="button" class="secondary" id="knowledgePrevious">Trang trước</button><button type="button" class="secondary" id="knowledgeNext">Trang sau</button></div></section>
    <article id="knowledgeDetail" class="panel" hidden><div class="comm-actions"><button type="button" class="secondary" id="backToKnowledge">← Danh sách chủ đề</button><button type="button" class="secondary" id="editKnowledgeTopic" hidden>Sửa chủ đề của tôi</button><button type="button" class="secondary" id="removeKnowledgeTopic" hidden>Gỡ chủ đề</button></div><h2 id="knowledgeDetailTitle"></h2><p id="knowledgeDetailCategory"></p><p id="knowledgeDetailMeta" class="muted"></p><p id="knowledgeDetailStatus" class="comm-status"></p><div id="knowledgeDetailBody" class="comm-body"></div><p id="knowledgeModerationNote"></p>
      <form id="knowledgeModerationForm" class="comm-form comm-moderation" hidden><h3>Duyệt chủ đề</h3><label>Ghi chú cho tác giả<textarea name="note" rows="2" maxlength="1000"></textarea></label><div class="comm-actions"><button type="submit" name="decision" value="approve">Duyệt hiển thị</button><button type="submit" class="secondary" name="decision" value="reject">Chưa chấp thuận / Ẩn chủ đề</button></div></form>
      <section aria-labelledby="knowledgeCommentsTitle"><h3 id="knowledgeCommentsTitle">Bình luận trao đổi</h3><div id="knowledgeComments"></div><button type="button" class="secondary" id="moreKnowledgeComments" hidden>Tải thêm bình luận</button><form id="knowledgeCommentForm" class="comm-form" hidden><label>Bình luận của bạn<textarea name="body" maxlength="5000" rows="4" required></textarea></label><button type="submit">Gửi bình luận</button></form><p id="knowledgeCommentState" role="alert"></p></section>
    </article>
  </div>
</section>
