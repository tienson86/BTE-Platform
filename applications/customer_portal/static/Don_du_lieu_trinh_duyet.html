<!doctype html><meta charset="utf-8"><title>Chuyển dữ liệu cũ vào máy chủ</title><style>body{font:18px/1.6 system-ui;max-width:800px;margin:40px auto}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style><h1>Chuyển dữ liệu cũ vào máy chủ</h1><p>Đăng nhập đúng tài khoản sở hữu hồ sơ cũ. Công cụ chỉ xóa nội dung lá số trên trình duyệt sau khi xác nhận mọi mã hồ sơ đã có trong kho tài khoản. Thực hiện riêng ở localhost và 127.0.0.1 nếu đã dùng cả hai.</p><a href="/login">Đăng nhập</a> · <a href="/history">Xem hồ sơ</a><p id="account"></p><button id="run" disabled>Chuyển, kiểm tra và xóa dữ liệu cũ trên trình duyệt</button><pre id="log"></pre><script src="/static/js/api.js"></script><script>
const keys=['bte_history','bte_portal_history','bte_last_result','bte_portal_last_result','bte_view_result'],out=document.getElementById('log');let user;
async function req(method,path,body){if(!BtePortal.getToken())throw Error('Cần đăng nhập trong tab này.');const res=await BtePortal.api(method,'/api/v1/'+path,body);if(res.success===false)throw Error(res.message);return res.data||res}
async function identity(){const d=await req('GET','auth/me');return d.user||d}
identity().then(u=>{user=u;document.getElementById('account').textContent='Tài khoản nhận hồ sơ: '+(u.display_name||u.username)+' · @'+u.username;document.getElementById('run').disabled=false}).catch(e=>out.textContent=e.message);
document.getElementById('run').onclick=async()=>{const btn=document.getElementById('run');btn.disabled=true;try{let rows=[],seen=new Set();for(const store of [localStorage,sessionStorage])for(const key of keys){const raw=store.getItem(key);if(!raw)continue;const value=JSON.parse(raw);for(const row of Array.isArray(value)?value:[value]){const id=row&&(row.analysis_id||row.id||(row.data&&(row.data.analysis_id||row.data.request_id)));if(!id||!row.data)throw Error('Dữ liệu cũ thiếu mã hoặc kết quả. Giữ nguyên để kiểm tra.');if(!seen.has(id)){seen.add(id);rows.push(Object.assign({},row,{id,analysis_id:id}))}}}for(const row of rows){if((await identity()).user_id!==user.user_id)throw Error('Tài khoản đã thay đổi.');await req('POST','analysis-archive',{rows:[row]})}if((await identity()).user_id!==user.user_id)throw Error('Tài khoản đã thay đổi.');const archive=(await req('GET','analysis-archive')).rows||[];if(!rows.every(r=>archive.some(a=>(a.id||a.analysis_id)===r.id&&a.data)))throw Error('Chưa đủ hồ sơ trên máy chủ. Giữ nguyên dữ liệu cũ.');for(const store of [localStorage,sessionStorage])for(const key of keys)store.removeItem(key);out.textContent='Đã xác nhận '+rows.length+' hồ sơ cũ trên máy chủ. Đã xóa nội dung lá số trong bộ nhớ trình duyệt tại địa chỉ này.';}catch(e){out.textContent='Dừng: '+e.message}finally{btn.disabled=false}};
</script>
